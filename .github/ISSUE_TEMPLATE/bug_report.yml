name: Bug report
description: Something behaves differently than it should
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A reproduction is worth ten paragraphs of description.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.4.2 or a1b2c3d
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, runtime version, browser, network (mainnet/testnet), chain
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md)
          required: true
